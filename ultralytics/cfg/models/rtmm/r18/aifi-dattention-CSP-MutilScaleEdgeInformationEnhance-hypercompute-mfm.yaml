# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + HyperCompute-MFM

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, HyperComputeModule, [384, 10]]                          # 14 (HyperCompute at P4)
  - [-1, 1, MANet, [384, True, 2, 3]]                               # 15 (MANet refine)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 16-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 17 (P5)

head:
  - [17, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 18 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 19
  - [-1, 1, Conv, [256, 1, 1]]                                      # 20, Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 21
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 22 input_proj.1
  - [[-2, -1], 1, MFM, [256]]                                       # 23
  - [-1, 3, RepC3, [256, 0.5]]                                      # 24
  - [-1, 1, Conv, [128, 1, 1]]                                      # 25, Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 26
  - [1, 1, SPDConv, [256]]                                          # 27 RGB P2 -> P3
  - [[-1, -2, 11], 1, MFM, [256]]                                   # 28
  - [-1, 1, CSPOmniKernel, []]                                      # 29
  - [-1, 3, RepC3, [256, 0.5]]                                      # 30

  - [-1, 1, Conv, [256, 3, 2]]                                      # 31
  - [[-1, 25], 1, MFM, [256]]                                       # 32
  - [-1, 3, RepC3, [256, 0.5]]                                      # 33

  - [-1, 1, Conv, [256, 3, 2]]                                      # 34
  - [[-1, 20], 1, MFM, [256]]                                       # 35
  - [-1, 3, RepC3, [256, 0.5]]                                      # 36

  - [[30, 33, 36], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]      # Detect(P3, P4, P5)
