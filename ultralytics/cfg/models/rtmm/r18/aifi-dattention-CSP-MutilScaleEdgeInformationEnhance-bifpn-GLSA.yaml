# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + BiFPN + GLSA

nc: 80
scales:
  l: [1.00, 1.00, 1024]
fusion_mode: bifpn
node_mode: RepC3
head_channel: 256

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5

  - [11, 1, GLSA, [head_channel]]                                   # 19 P3/8
  - [13, 1, GLSA, [head_channel]]                                   # 20 P4/16
  - [18, 1, GLSA, [head_channel]]                                   # 21 P5/32

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 22 P5->P4
  - [[-1, 20], 1, Fusion, [fusion_mode]]                            # 23
  - [-1, 3, node_mode, [head_channel, 0.5]]                         # 24 P4/16

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 25 P4->P3
  - [[-1, 19], 1, Fusion, [fusion_mode]]                            # 26
  - [-1, 3, node_mode, [head_channel, 0.5]]                         # 27 P3/8

  - [[1, 6], 1, Concat, [1]]                                        # 28 fused P2/4
  - [-1, 1, Conv, [head_channel, 3, 2]]                             # 29 P2->P3
  - [[-1, 19, 27], 1, Fusion, [fusion_mode]]                        # 30
  - [-1, 3, node_mode, [head_channel, 0.5]]                         # 31 P3/8

  - [-1, 1, Conv, [head_channel, 3, 2]]                             # 32 P3->P4
  - [[-1, 20, 24], 1, Fusion, [fusion_mode]]                        # 33
  - [-1, 3, node_mode, [head_channel, 0.5]]                         # 34 P4/16

  - [-1, 1, Conv, [head_channel, 3, 2]]                             # 35 P4->P5
  - [[-1, 21], 1, Fusion, [fusion_mode]]                            # 36
  - [-1, 3, node_mode, [head_channel, 0.5]]                         # 37 P5/32

  - [[31, 34, 37], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]      # Detect(P3, P4, P5)
