# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + ASF-P2-lite + SDFM
# SDFM replaces Concat+Conv fusion: [4, 9] -> SpatialDependencyPerception -> Conv(256). No Concat, same layer count as base.
# Paper: HS-FPN: High Frequency and Spatial Perception FPN for Tiny Object Detection (AAAI 2025)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3 via SDFM (replaces Concat+Conv)
  - [[4, 9], 1, SpatialDependencyPerception, [null, 8, null]]       # 10 (SDFM: RGB P3 x X P3 -> 256ch)
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3, ensure 256)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 19
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 20 input_proj.1 (P3)
  - [[-1, 13, -2], 1, Zoom_cat, []]                                 # 21
  - [-1, 3, RepC3, [256, 0.5]]                                      # 22 Y4
  - [-1, 1, Conv, [256, 1, 1]]                                      # 23

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 24
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 25 input_proj.0-lite (P2 256->128)
  - [[-1, 11, -2], 1, Zoom_cat, []]                                 # 26
  - [-1, 3, RepC3, [256, 0.5]]                                      # 27 P3

  - [-1, 1, Conv, [256, 3, 2]]                                      # 28
  - [[-1, 23], 1, Concat, [1]]                                      # 29
  - [-1, 3, RepC3, [256, 0.5]]                                      # 30 P4

  - [-1, 1, Conv, [256, 3, 2]]                                      # 31
  - [[-1, 18], 1, Concat, [1]]                                      # 32
  - [-1, 3, RepC3, [256, 0.5]]                                      # 33 P5

  - [[11, 13, 16], 1, ScalSeq, [256]]                               # 34
  - [[27, -1], 1, Add, []]                                          # 35

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 36
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 37 P2-lite proj
  - [[-1, -2], 1, Concat, [1]]                                      # 38
  - [-1, 3, RepC3, [128, 0.5]]                                      # 39 P2-lite

  - [[2, 35, 30], 1, ScalSeq, [128]]                                # 40 P2-lite context
  - [[39, -1], 1, Add, []]                                          # 41
  - [-1, 1, Conv, [256, 1, 1]]                                      # 42 restore to decoder dim

  - [[42, 35, 30, 33], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 43 Detect(P2, P3, P4, P5)
