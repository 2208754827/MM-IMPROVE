# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + ASF-P2-lite + ScalarGate
# ScalarGate is inserted after #11 (Fused P3) as a global scalar-gate attention refinement on [4, 9].
# All downstream layer indices are shifted by +1 accordingly.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)
  - [[4, 9], 1, ScalarGate, []]                                     # 12 (ScalarGate attention on P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 13-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 14 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 15-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 16 (P5)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 17 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 18
  - [-1, 1, Conv, [256, 1, 1]]                                      # 19 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 20
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 21 input_proj.1 (P3, use fused #11)
  - [[-1, 14, -2], 1, Zoom_cat, []]                                 # 22
  - [-1, 3, RepC3, [256, 0.5]]                                      # 23 Y4
  - [-1, 1, Conv, [256, 1, 1]]                                      # 24

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 25
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 26 input_proj.0-lite (P2 256->128)
  - [[-1, 11, -2], 1, Zoom_cat, []]                                 # 27
  - [-1, 3, RepC3, [256, 0.5]]                                      # 28 P3

  - [-1, 1, Conv, [256, 3, 2]]                                      # 29
  - [[-1, 24], 1, Concat, [1]]                                      # 30
  - [-1, 3, RepC3, [256, 0.5]]                                      # 31 P4

  - [-1, 1, Conv, [256, 3, 2]]                                      # 32
  - [[-1, 19], 1, Concat, [1]]                                      # 33
  - [-1, 3, RepC3, [256, 0.5]]                                      # 34 P5

  - [[11, 14, 17], 1, ScalSeq, [256]]                               # 35
  - [[28, -1], 1, Add, []]                                          # 36

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 37
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 38 P2-lite proj
  - [[-1, -2], 1, Concat, [1]]                                      # 39
  - [-1, 3, RepC3, [128, 0.5]]                                      # 40 P2-lite

  - [[2, 36, 31], 1, ScalSeq, [128]]                                # 41 P2-lite context
  - [[40, -1], 1, Add, []]                                          # 42
  - [-1, 1, Conv, [256, 1, 1]]                                      # 43 restore to decoder dim

  - [[43, 36, 31, 34], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 44 Detect(P2, P3, P4, P5)
