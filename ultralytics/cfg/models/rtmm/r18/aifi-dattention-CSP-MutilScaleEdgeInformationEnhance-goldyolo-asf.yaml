# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + goldyolo-asf

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5

  # goldyolo-asf fusion trunk
  - [[2, 11, 13, 15], 1, SimFusion_4in, []]                         # 19
  - [-1, 1, IFM, [[64, 32]]]                                        # 20

  - [18, 1, Conv, [256, 1, 1]]                                      # 21
  - [[11, 13, -1], 1, SimFusion_3in, [256]]                         # 22
  - [[-1, 20], 1, InjectionMultiSum_Auto_pool, [256, [64, 32], 0]] # 23
  - [-1, 3, RepC3, [256, 0.5]]                                      # 24

  - [13, 1, Conv, [256, 1, 1]]                                      # 25
  - [[2, 11, -1], 1, SimFusion_3in, [256]]                          # 26
  - [[-1, 20], 1, InjectionMultiSum_Auto_pool, [256, [64, 32], 1]] # 27
  - [-1, 3, RepC3, [256, 0.5]]                                      # 28

  - [[28, 24, 18], 1, PyramidPoolAgg, [352, 2]]                     # 29
  - [-1, 1, Conv, [192, 1, 1]]                                      # 30 (TopBasicLayer replacement)

  - [[28, 25], 1, AdvPoolFusion, []]                                # 31
  - [[-1, 30], 1, InjectionMultiSum_Auto_pool, [256, [64, 128], 0]]# 32
  - [-1, 3, RepC3, [256, 0.5]]                                      # 33

  - [[-1, 21], 1, AdvPoolFusion, []]                                # 34
  - [[-1, 30], 1, InjectionMultiSum_Auto_pool, [256, [64, 128], 1]]# 35
  - [-1, 3, RepC3, [256, 0.5]]                                      # 36

  - [[11, 13, 18], 1, ScalSeq, [256]]                               # 37
  - [[28, -1], 1, Add, []]                                          # 38

  - [[38, 33, 36], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
