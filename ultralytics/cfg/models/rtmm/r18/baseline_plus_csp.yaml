# Ultralytics YOLO 🚀, AGPL-3.0 license
# Baseline + CSP_MutilScaleEdgeInformationEnhance
# Backbone: Conv downsample + CSP enhancement (same structure as new_data.yaml)
# Fusion: simple Concat+Conv at P3 (no CMXFusion)
# Head: standard FPN/PAN + AIFI (unchanged)

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants
  l: [1.00, 1.00, 1024]

# Model architecture
backbone:
  # ----------------------------------------------------------
  # RGB branch
  # ----------------------------------------------------------
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                       # 0  RGB P1/2
  - [-1, 1, Conv, [128, 3, 2]]                             # 1  RGB P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]    # 2  RGB P2

  # ----------------------------------------------------------
  # IR branch
  # ----------------------------------------------------------
  - [-1, 1, Conv, [64, 3, 2], 'X']                         # 3  IR P1/2
  - [-1, 1, Conv, [128, 3, 2]]                             # 4  IR P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]   # 5  IR P2

  # ----------------------------------------------------------
  # RGB -> P3
  # ----------------------------------------------------------
  - [2, 1, Conv, [256, 3, 2]]                              # 6  RGB P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]    # 7  RGB P3

  # ----------------------------------------------------------
  # IR -> P3
  # ----------------------------------------------------------
  - [5, 1, Conv, [256, 3, 2]]                              # 8  IR P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]    # 9  IR P3

  # ----------------------------------------------------------
  # P3 simple fusion (Concat+Conv, no CMXFusion)
  # ----------------------------------------------------------
  - [[7, 9], 1, Concat, [1]]                               # 10 Concat RGB+IR P3 (512ch)
  - [-1, 1, Conv, [256, 1, 1]]                             # 11 Fused P3 (256ch)

  # ----------------------------------------------------------
  # Single-stream trunk
  # ----------------------------------------------------------
  - [-1, 1, Conv, [384, 3, 2]]                             # 12 P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]   # 13 P4

  - [-1, 1, Conv, [384, 3, 2]]                             # 14 P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]   # 15 P5

head:
  # ----------------------------------------------------------
  # P5 semantic enhancement (AIFI unchanged)
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 16 input_proj.2 (P5 384->256)
  - [-1, 1, AIFI, [1024, 8]]                               # 17 AIFI
  - [-1, 1, Conv, [256, 1, 1]]                             # 18 Y5

  # ----------------------------------------------------------
  # P5 -> P4 top-down
  # ----------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]             # 19
  - [13, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 20 input_proj.1 (P4 384->256)
  - [[-2, -1], 1, Concat, [1]]                             # 21
  - [-1, 3, RepC3, [256, 0.5]]                             # 22 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                             # 23 Y4

  # ----------------------------------------------------------
  # P4 -> P3 top-down
  # ----------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]             # 24
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 25 input_proj.0 (Fused P3 256->256)
  - [[-2, -1], 1, Concat, [1]]                             # 26 cat backbone P3
  - [-1, 3, RepC3, [256, 0.5]]                             # 27 fpn_blocks.1 (P3)

  # ----------------------------------------------------------
  # P3 -> P4 bottom-up
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]                             # 28 downsample_convs.0
  - [[-1, 23], 1, Concat, [1]]                             # 29 cat Y4
  - [-1, 3, RepC3, [256, 0.5]]                             # 30 pan_blocks.0 (P4)

  # ----------------------------------------------------------
  # P4 -> P5 bottom-up
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]                             # 31 downsample_convs.1
  - [[-1, 18], 1, Concat, [1]]                             # 32 cat Y5
  - [-1, 3, RepC3, [256, 0.5]]                             # 33 pan_blocks.1 (P5)

  # ----------------------------------------------------------
  # RT-DETR Decoder
  # ----------------------------------------------------------
  - [[27, 30, 33], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 34 Detect(P3, P4, P5)
