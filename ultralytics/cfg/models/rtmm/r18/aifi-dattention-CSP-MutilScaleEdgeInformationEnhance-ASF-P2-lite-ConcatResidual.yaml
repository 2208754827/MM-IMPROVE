# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + ASF-P2-lite + ConcatResidual
# Rule: based on ASF-P2-lite, apply "Concat -> 1x1 Conv -> Add(residual)" at key concat fusion nodes.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3 (improved concat)
  - [[4, 9], 1, MCFGatedFusion, ['add', 1]]                         # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 19
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 20 input_proj.1 (P3)
  - [[-1, 13, -2], 1, Zoom_cat, []]                                 # 21
  - [-1, 3, RepC3, [256, 0.5]]                                      # 22 Y4
  - [-1, 1, Conv, [256, 1, 1]]                                      # 23

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 24
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 25 input_proj.0-lite (P2 256->128)
  - [[-1, 11, -2], 1, Zoom_cat, []]                                 # 26
  - [-1, 3, RepC3, [256, 0.5]]                                      # 27 P3

  - [-1, 1, Conv, [256, 3, 2]]                                      # 28
  - [[-1, 23], 1, Concat, [1]]                                      # 29
  - [-1, 1, Conv, [256, 1, 1]]                                      # 30
  - [[-1, 23], 1, Add, []]                                          # 31 (P4 concat residual)
  - [-1, 3, RepC3, [256, 0.5]]                                      # 32 P4

  - [-1, 1, Conv, [256, 3, 2]]                                      # 33
  - [[-1, 18], 1, Concat, [1]]                                      # 34
  - [-1, 1, Conv, [256, 1, 1]]                                      # 35
  - [[-1, 18], 1, Add, []]                                          # 36 (P5 concat residual)
  - [-1, 3, RepC3, [256, 0.5]]                                      # 37 P5

  - [[11, 13, 16], 1, ScalSeq, [256]]                               # 38
  - [[27, -1], 1, Add, []]                                          # 39

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 40
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 41 P2-lite proj
  - [[-1, -2], 1, Concat, [1]]                                      # 42
  - [-1, 1, Conv, [128, 1, 1]]                                      # 43
  - [[-1, 41], 1, Add, []]                                          # 44 (P2 concat residual)
  - [-1, 3, RepC3, [128, 0.5]]                                      # 45 P2-lite

  - [[2, 39, 32], 1, ScalSeq, [128]]                                # 46 P2-lite context
  - [[45, -1], 1, Add, []]                                          # 47
  - [-1, 1, Conv, [256, 1, 1]]                                      # 48 restore to decoder dim

  - [[48, 39, 32, 37], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 49 Detect(P2, P3, P4, P5)
