# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + p6-CTrans

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]

  # Mid-level fusion at P3 with CTrans (CTF)
  - [[4, 9], 1, CrossTransformerFusion, [null, 4, 1, 0.0]]
  - [-1, 1, Conv, [256, 1, 1]]

  # Fused trunk P4/P5
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]

head:
  # P5 enhancement
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]
  - [-1, 1, Conv, [256, 1, 1]]  # P5

  # Generate P6 from P5
  - [-1, 1, Conv, [384, 3, 2]]  # P6/64

  # Top-down: P6 -> P5
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # input_proj.3
  - [-1, 1, Conv, [256, 1, 1]]  # Y6
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [18, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # input_proj.2 (P5)
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]  # Y5

  # Top-down: P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [13, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # input_proj.1 (P4)
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]  # Y4

  # Top-down: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # input_proj.0 (P3)
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # P3 out

  # Bottom-up PAN
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 31], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # P4 out

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 26], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # P5 out

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]  # P6 out

  - [[35, 38, 41, 44], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
