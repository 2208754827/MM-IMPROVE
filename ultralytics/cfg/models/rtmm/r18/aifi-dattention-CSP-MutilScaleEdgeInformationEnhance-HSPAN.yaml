# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + HSPAN (zip-style)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5

  - [-1, 1, ChannelAttention_HSFPN, []]                             # 19
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 20 P5
  - [-1, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1]]                  # 21 P5->P4

  - [13, 1, ChannelAttention_HSFPN, []]                             # 22
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 23
  - [21, 1, ChannelAttention_HSFPN, [4, False]]                     # 24 gate map
  - [[-1, -2], 1, Multiply, []]                                     # 25
  - [[-1, 21], 1, Add, []]                                          # 26
  - [-1, 3, RepC3, [256, 0.5]]                                      # 27 P4

  - [21, 1, nn.ConvTranspose2d, [256, 3, 2, 1, 1, 16]]              # 28 P4->P3
  - [11, 1, ChannelAttention_HSFPN, []]                             # 29
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 30
  - [28, 1, ChannelAttention_HSFPN, [4, False]]                     # 31 gate map
  - [[-1, -2], 1, Multiply, []]                                     # 32
  - [[-1, 28], 1, Add, []]                                          # 33
  - [-1, 3, RepC3, [256, 0.5]]                                      # 34 P3

  - [-1, 1, Conv, [256, 3, 2]]                                      # 35 P3->P4
  - [27, 1, ChannelAttention_HSFPN, []]                             # 36
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 37
  - [35, 1, ChannelAttention_HSFPN, [4, False]]                     # 38 gate map
  - [[-1, -2], 1, Multiply, []]                                     # 39
  - [[-1, 35], 1, Add, []]                                          # 40
  - [-1, 3, RepC3, [256, 0.5]]                                      # 41 P4

  - [35, 1, Conv, [256, 3, 2]]                                      # 42 P4->P5
  - [20, 1, ChannelAttention_HSFPN, []]                             # 43
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 44
  - [42, 1, ChannelAttention_HSFPN, [4, False]]                     # 45 gate map
  - [[-1, -2], 1, Multiply, []]                                     # 46
  - [[-1, 42], 1, Add, []]                                          # 47
  - [-1, 3, RepC3, [256, 0.5]]                                      # 48 P5

  - [[34, 41, 48], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
