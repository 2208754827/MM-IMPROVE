# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + FSA (zip-style)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [15, 1, FSA, [20]]                                              # 16 P5-FSA
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 17 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 18
  - [-1, 1, Conv, [256, 1, 1]]                                      # 19 Y5

  - [13, 1, FSA, [40]]                                              # 20 P4-FSA
  - [11, 1, FSA, [80]]                                              # 21 P3-FSA

  - [19, 1, nn.Upsample, [None, 2, 'nearest']]                      # 22
  - [20, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 23 input_proj.1
  - [[-2, -1], 1, Concat, [1]]                                      # 24
  - [-1, 3, RepC3, [256, 0.5]]                                      # 25
  - [-1, 1, Conv, [256, 1, 1]]                                      # 26 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 27
  - [21, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 28 input_proj.0
  - [[-2, -1], 1, Concat, [1]]                                      # 29
  - [-1, 3, RepC3, [256, 0.5]]                                      # 30 P3

  - [-1, 1, Conv, [256, 3, 2]]                                      # 31
  - [[-1, 26], 1, Concat, [1]]                                      # 32
  - [-1, 3, RepC3, [256, 0.5]]                                      # 33 P4

  - [-1, 1, Conv, [256, 3, 2]]                                      # 34
  - [[-1, 19], 1, Concat, [1]]                                      # 35
  - [-1, 3, RepC3, [256, 0.5]]                                      # 36 P5

  - [[30, 33, 36], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]      # Detect(P3, P4, P5)
