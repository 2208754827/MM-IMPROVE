# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + CGRFPN

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5

  - [[11, 13, 18], 1, PyramidContextExtraction, []]                 # 19
  - [19, 1, GetIndexOutput, [0]]                                    # 20-P3/8
  - [19, 1, GetIndexOutput, [1]]                                    # 21-P4/16
  - [19, 1, GetIndexOutput, [2]]                                    # 22-P5/32

  - [18, 1, RCM, []]                                                # 23-P5/32
  - [[-1, 22], 1, FuseBlockMulti, []]                               # 24-P5/32

  - [13, 1, RCM, []]                                                # 25-P4/16
  - [[-1, 24], 1, DynamicInterpolationFusion, []]                   # 26-P4/16
  - [[-1, 21], 1, FuseBlockMulti, []]                               # 27-P4/16

  - [11, 1, RCM, []]                                                # 28-P3/8
  - [[-1, 27], 1, DynamicInterpolationFusion, []]                   # 29-P3/8
  - [[-1, 20], 1, FuseBlockMulti, []]                               # 30-P3/8

  - [-1, 1, Conv, [256, 3, 2]]                                      # 31-P4/16
  - [[-1, 27], 1, Concat, [1]]                                      # 32-P4/16
  - [-1, 3, RepC3, [256, 0.5]]                                      # 33-P4/16

  - [-1, 1, Conv, [256, 3, 2]]                                      # 34-P5/32
  - [[-1, 24], 1, Concat, [1]]                                      # 35-P5/32
  - [-1, 3, RepC3, [256, 0.5]]                                      # 36-P5/32

  - [[30, 33, 36], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]      # 37 Detect(P3, P4, P5)
