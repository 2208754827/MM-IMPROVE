# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + ASF-P2-lite + SuperYOLOFusion
# SuperYOLOFusion replaces Concat+Conv fusion: [4, 9] -> SuperYOLOFusion -> 256ch output.
# SuperYOLO (TGRS 2023): Symmetric SE + Cross-Modal Spatial Mask + Residual + Global SE + 1x1 Conv.
# Output channels = 256. Same layer count as CMXFusion-based YAML.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3 via SuperYOLOFusion (replaces Concat+Conv)
  - [[4, 9], 1, SuperYOLOFusion, []]                                # 10 (SE+CrossMask: 256+256 -> 256ch)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 11-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 12 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 13-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 14 (P5)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 15 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 16
  - [-1, 1, Conv, [256, 1, 1]]                                      # 17 Y5

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 18
  - [10, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 19 input_proj.1 (P3)
  - [[-1, 12, -2], 1, Zoom_cat, []]                                 # 20
  - [-1, 3, RepC3, [256, 0.5]]                                      # 21 Y4
  - [-1, 1, Conv, [256, 1, 1]]                                      # 22

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 23
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 24 input_proj.0-lite (P2 256->128)
  - [[-1, 10, -2], 1, Zoom_cat, []]                                 # 25
  - [-1, 3, RepC3, [256, 0.5]]                                      # 26 P3

  - [-1, 1, Conv, [256, 3, 2]]                                      # 27
  - [[-1, 22], 1, Concat, [1]]                                      # 28
  - [-1, 3, RepC3, [256, 0.5]]                                      # 29 P4

  - [-1, 1, Conv, [256, 3, 2]]                                      # 30
  - [[-1, 17], 1, Concat, [1]]                                      # 31
  - [-1, 3, RepC3, [256, 0.5]]                                      # 32 P5

  - [[10, 12, 15], 1, ScalSeq, [256]]                               # 33
  - [[26, -1], 1, Add, []]                                          # 34

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 35
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]                    # 36 P2-lite proj
  - [[-1, -2], 1, Concat, [1]]                                      # 37
  - [-1, 3, RepC3, [128, 0.5]]                                      # 38 P2-lite

  - [[2, 34, 29], 1, ScalSeq, [128]]                                # 39 P2-lite context
  - [[38, -1], 1, Add, []]                                          # 40
  - [-1, 1, Conv, [256, 1, 1]]                                      # 41 restore to decoder dim

  - [[41, 34, 29, 32], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 42 Detect(P2, P3, P4, P5)
