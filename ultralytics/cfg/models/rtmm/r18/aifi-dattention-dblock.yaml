# RT-DETR-r18 MultiModal Mid-level Fusion model (mm-mid-c2f-csi)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB']   # 0
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]          # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]          # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                                 # 3

  # X stem
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X']     # 4
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]          # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]          # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                                 # 7

  # RGB ResNet18 stages (to P3)
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]                   # 8
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]                 # 9   (RGB P3)

  # X ResNet18 stages (to P3)
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]                   # 10
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]                 # 11  (X P3)

  # Mid-level Fusion at P3
  - [[9, 11], 1, Concat, [1]]                                        # 12
  - [-1, 1, Conv, [256, 1, 1]]                                       # 13  (fused P3)

  # Balanced enhancement at fused P3 (cheap + effective)
  - [-1, 2,C2f_DBlock, [256]]                                          # 14  (enhanced P3, repeats=2)

  # Continue processing fused features (keep original)
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]                 # 15  (P4/16)
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]                 # 16  (P5/32)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                    # 17
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]              # 18
  - [-1, 1, Conv, [256, 1, 1]]                                       # 19

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                       # 20
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]]                    # 21  (原来是 14，这里改成 P4=15)
  - [[-2, -1], 1, Concat, [1]]                                       # 22
  - [-1, 3, RepC3, [256, 0.5]]                                       # 23
  - [-1, 1, Conv, [256, 1, 1]]                                       # 24

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                       # 25
  - [14, 1, Conv, [256, 1, 1, None, 1, 1, False]]                    # 26  (原来是 13，这里改成增强P3=14)
  - [[-2, -1], 1, Concat, [1]]                                       # 27
  - [-1, 3, RepC3, [256, 0.5]]                                       # 28

  - [-1, 1, Conv, [256, 3, 2]]                                       # 29
  - [[-1, 23], 1, Concat, [1]]                                       # 30
  - [-1, 3, RepC3, [256, 0.5]]                                       # 31

  - [-1, 1, Conv, [256, 3, 2]]                                       # 32
  - [[-1, 18], 1, Concat, [1]]                                       # 33
  - [-1, 3, RepC3, [256, 0.5]]                                       # 34

  - [[27, 30, 33], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]        # 35
