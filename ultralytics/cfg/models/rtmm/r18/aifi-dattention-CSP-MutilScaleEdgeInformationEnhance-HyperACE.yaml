# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + HyperACE (zip-style)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5

  - [11, 1, Conv, [256, 1, 1]]                                      # 19 P3 projection
  - [[19, 13, 18], 2, HyperACE, [256, 8, True, True, 0.5, 1, 'both']] # 20 P4 enhanced
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 21 P3 enhanced
  - [20, 1, Conv, [256, 3, 2]]                                      # 22 P5 enhanced
  - [[20, 20], 1, FullPAD_Tunnel, []]                               # 23 P4 tunnel
  - [[11, 21], 1, FullPAD_Tunnel, []]                               # 24 P3 tunnel
  - [[18, 22], 1, FullPAD_Tunnel, []]                               # 25 P5 tunnel

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 26
  - [13, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 27 input_proj.1
  - [[-2, -1], 1, Concat, [1]]                                      # 28
  - [-1, 3, RepC3, [256, 0.5]]                                      # 29
  - [[-1, 20], 1, FullPAD_Tunnel, []]                               # 30 P4
  - [-1, 1, Conv, [256, 1, 1]]                                      # 31 Y4

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 32
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 33 input_proj.0
  - [[-2, -1], 1, Concat, [1]]                                      # 34
  - [-1, 3, RepC3, [256, 0.5]]                                      # 35
  - [[-1, 21], 1, FullPAD_Tunnel, []]                               # 36 P3

  - [-1, 1, Conv, [256, 3, 2]]                                      # 37
  - [[-1, 31], 1, Concat, [1]]                                      # 38
  - [-1, 3, RepC3, [256, 0.5]]                                      # 39
  - [[-1, 20], 1, FullPAD_Tunnel, []]                               # 40 P4

  - [-1, 1, Conv, [256, 3, 2]]                                      # 41
  - [[-1, 25], 1, Concat, [1]]                                      # 42
  - [-1, 3, RepC3, [256, 0.5]]                                      # 43
  - [[-1, 22], 1, FullPAD_Tunnel, []]                               # 44 P5

  - [[36, 40, 44], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]      # Detect(P3, P4, P5)
