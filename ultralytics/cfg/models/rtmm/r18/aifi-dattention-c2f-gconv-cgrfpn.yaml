# RT-DETR-r18 MultiModal Mid-level Fusion + C2f_gConv + CGRFPN
# Migrated modules: PyramidContextExtraction, GetIndexOutput, RCM, FuseBlockMulti, DynamicInterpolationFusion

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB Branch - Process RGB modality
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB']  # 0-P1/2 RGB input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]         # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]         # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                                 # 3-P2/4

  # X Branch - Process X modality
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X']    # 4-P1/2 X input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]         # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]         # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                                 # 7-P2/4

  # RGB ResNet18 stages
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]                   # 8-RGB Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]                 # 9-RGB Stage3 P3/8

  # X ResNet18 stages
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]                   # 10-X Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]                 # 11-X Stage3 P3/8

  # Mid-level Fusion at P3
  - [[9, 11], 1, Concat, [1]]                                        # 12
  - [-1, 1, Conv, [256, 1, 1]]                                       # 13

  # P3 enhancement
  - [-1, 2, C2f_gConv, [256]]                                        # 14

  # Continue processing fused features
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]                # 15-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]                # 16-P5/32

head:
  - [16, 1, Conv, [256, 1, 1, None, 1, 1, False]]                    # 17 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]              # 18
  - [-1, 1, Conv, [256, 1, 1]]                                       # 19 Y5

  - [[14, 15, 19], 1, PyramidContextExtraction, []]                  # 20
  - [20, 1, GetIndexOutput, [0]]                                     # 21-P3/8
  - [20, 1, GetIndexOutput, [1]]                                     # 22-P4/16
  - [20, 1, GetIndexOutput, [2]]                                     # 23-P5/32

  - [19, 1, RCM, []]                                                 # 24-P5/32
  - [[-1, 23], 1, FuseBlockMulti, []]                                # 25-P5/32

  - [15, 1, RCM, []]                                                 # 26-P4/16
  - [[-1, 25], 1, DynamicInterpolationFusion, []]                    # 27-P4/16
  - [[-1, 22], 1, FuseBlockMulti, []]                                # 28-P4/16

  - [14, 1, RCM, []]                                                 # 29-P3/8
  - [[-1, 28], 1, DynamicInterpolationFusion, []]                    # 30-P3/8
  - [[-1, 21], 1, FuseBlockMulti, []]                                # 31-P3/8

  - [-1, 1, Conv, [256, 3, 2]]                                       # 32-P4/16
  - [[-1, 28], 1, Concat, [1]]                                       # 33-P4/16
  - [-1, 3, RepC3, [256, 0.5]]                                       # 34-P4/16

  - [-1, 1, Conv, [256, 3, 2]]                                       # 35-P5/32
  - [[-1, 25], 1, Concat, [1]]                                       # 36-P5/32
  - [-1, 3, RepC3, [256, 0.5]]                                       # 37-P5/32

  - [[31, 34, 37], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]       # 38 Detect(P3, P4, P5)
