# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + CFPT-P3456

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]]

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]
  - [-1, 1, Conv, [256, 1, 1]]  # P5

  - [13, 1, Conv, [256, 1, 1]]  # P4
  - [11, 1, Conv, [256, 1, 1]]  # P3

  - [[20, 19, 18], 1, CrossLayerChannelAttention, [256]]
  - [21, 1, GetIndexOutput, [0]]
  - [21, 1, GetIndexOutput, [1]]
  - [21, 1, GetIndexOutput, [2]]

  - [[22, 23, 24], 1, CrossLayerSpatialAttention, [256]]
  - [25, 1, GetIndexOutput, [0]]
  - [25, 1, GetIndexOutput, [1]]
  - [25, 1, GetIndexOutput, [2]]

  - [[20, 26], 1, Add, []]  # P3
  - [[19, 27], 1, Add, []]  # P4
  - [[18, 28], 1, Add, []]  # P5

  - [-1, 1, Conv, [512, 3, 2]]  # P6

  - [[29, 30, 31, 32], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
