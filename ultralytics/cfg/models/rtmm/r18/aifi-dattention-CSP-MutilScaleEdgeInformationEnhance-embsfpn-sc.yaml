# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance backbone
# + EMBSFPN-SC neck (Fusion + EUCB + CSP_MSCB)

nc: 80
scales:
  l: [1.00, 1.00, 1024]

fusion_mode: bifpn
node_mode: CSP_MSCB_SC
head_channel: 128

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  # DAttention on top feature
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18 Y5 lateral

  # Build EMBSFPN-SC pyramid inputs
  - [11, 1, Conv, [head_channel]]                                   # 19 P3/8
  - [13, 1, Conv, [head_channel]]                                   # 20 P4/16
  - [18, 1, Conv, [head_channel]]                                   # 21 P5/32

  # Top-down + bottom-up bidirectional fusion
  - [20, 1, Conv, [head_channel, 3, 2]]                             # 22 P4->P5
  - [[-1, 21], 1, Fusion, [fusion_mode]]                            # 23
  - [-1, 3, node_mode, [head_channel, [5, 7, 9]]]                   # 24 P5_td

  - [-1, 1, EUCB_SC, []]                                            # 25 P5->P4
  - [19, 1, Conv, [head_channel, 3, 2]]                             # 26 P3->P4
  - [[-1, -2, 20], 1, Fusion, [fusion_mode]]                        # 27
  - [-1, 3, node_mode, [head_channel, [3, 5, 7]]]                   # 28 P4_td

  - [-1, 1, EUCB_SC, []]                                            # 29 P4->P3
  - [19, 1, Conv, [head_channel, 3, 1]]                             # 30 P3 keep-scale
  - [[-1, -2, 19], 1, Fusion, [fusion_mode]]                        # 31
  - [-1, 3, node_mode, [head_channel, [1, 3, 5]]]                   # 32 P3_mid

  - [[29, -1], 1, Fusion, [fusion_mode]]                            # 33
  - [-1, 3, node_mode, [head_channel, [1, 3, 5]]]                   # 34 P3_out

  - [32, 1, Conv, [head_channel, 3, 2]]                             # 35 P3->P4
  - [34, 1, Conv, [head_channel, 3, 2]]                             # 36 P3->P4
  - [[-1, -2, 28, 25], 1, Fusion, [fusion_mode]]                    # 37
  - [-1, 3, node_mode, [head_channel, [3, 5, 7]]]                   # 38 P4_out

  - [28, 1, Conv, [head_channel, 3, 2]]                             # 39 P4->P5
  - [38, 1, Conv, [head_channel, 3, 2]]                             # 40 P4->P5
  - [[-1, -2, 24], 1, Fusion, [fusion_mode]]                        # 41
  - [-1, 3, node_mode, [head_channel, [5, 7, 9]]]                   # 42 P5_out

  - [[34, 38, 42], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]      # 43 Detect(P3,P4,P5)
