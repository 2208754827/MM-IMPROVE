# RT-DETR-r18 MultiModal Mid-level Fusion model (balanced for 16G 4060Ti)
# Key change: add C2f_AdditiveBlock_CGLU (repeats=2) right after fused P3 (256ch).
# Keep stems and P4/P5 Blocks unchanged; adjust head indices accordingly.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB Branch - Process RGB modality
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'RGB']  # 0-P1/2 RGB input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]         # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]         # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                                 # 3-P2/4

  # X Branch - Process X modality
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu'], 'X']    # 4-P1/2 X input
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]         # 5
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]         # 6
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]                                 # 7-P2/4

  # RGB ResNet18 stages
  - [3, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]                   # 8-RGB Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]                 # 9-RGB Stage3 P3/8

  # X ResNet18 stages
  - [7, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]                   # 10-X Stage2
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]                 # 11-X Stage3 P3/8

  # Mid-level Fusion at P3
  - [[9, 11], 1, Concat, [1]]                                        # 12 - Concat RGB and X features at P3
  - [-1, 1, Conv, [256, 1, 1]]                                       # 13 - Fusion conv to reduce channels

  # ✅ Balanced enhancement (cheap & effective for multimodal): fused P3 @ 256ch
  - [-1, 2, C2f_FasterSFSConv, [256]]                            # 14 - repeats=2

  # Continue processing fused features (keep original)
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]                  # 15-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]                  # 16-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]                     # 17
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]               # 18
  - [-1, 1, Conv, [256, 1, 1]]                                        # 19

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                        # 20
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]]                     # 21 (P4 from backbone 15)
  - [[-2, -1], 1, Concat, [1]]                                        # 22
  - [-1, 3, RepC3, [256, 0.5]]                                        # 23
  - [-1, 1, Conv, [256, 1, 1]]                                        # 24

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                        # 25
  - [14, 1, Conv, [256, 1, 1, None, 1, 1, False]]                     # 26 (Enhanced fused P3 from backbone 14)
  - [[-2, -1], 1, Concat, [1]]                                        # 27
  - [-1, 3, RepC3, [256, 0.5]]                                        # 28

  - [-1, 1, Conv, [256, 3, 2]]                                        # 29
  - [[-1, 24], 1, Concat, [1]]                                        # 30 cat Y4 (lateral at 24)
  - [-1, 3, RepC3, [256, 0.5]]                                        # 31

  - [-1, 1, Conv, [256, 3, 2]]                                        # 32
  - [[-1, 19], 1, Concat, [1]]                                        # 33 cat Y5 (lateral at 19)
  - [-1, 3, RepC3, [256, 0.5]]                                        # 34

  - [[28, 31, 34], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]         # 35 Detect(P3, P4, P5)
