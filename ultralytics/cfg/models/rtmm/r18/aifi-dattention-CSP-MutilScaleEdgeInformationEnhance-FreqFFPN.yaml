# RT-DETR-r18 MM mid + TransformerEncoderLayer_DAttention + FreqFFPN

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]]

  # Fused trunk P4/P5
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]
  - [-1, 1, Conv, [384, 3, 2]]
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]
  - [-1, 1, Conv, [256, 1, 1]]

  - [13, 1, Conv, [256, 1]]
  - [11, 1, Conv, [256, 1]]

  - [[19, 18], 1, FreqFusion, []]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]

  - [[20, -1], 1, FreqFusion, []]
  - [-1, 3, RepC3, [256, 0.5]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  - [[25, 28, 31], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
