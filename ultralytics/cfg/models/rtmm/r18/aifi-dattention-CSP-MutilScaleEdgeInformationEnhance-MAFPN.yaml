# RT-DETR-r18 MM mid + DAttention + CSP_MutilScaleEdgeInformationEnhance + MAFPN

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                                # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 1-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]                                      # 3-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 4 (RGB P3)

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']                                  # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                                      # 6-P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]            # 7
  - [-1, 1, Conv, [256, 3, 2]]                                      # 8-P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]            # 9 (X P3)

  # Mid-level fusion at P3
  - [[4, 9], 1, Concat, [1]]                                        # 10
  - [-1, 1, Conv, [256, 1, 1]]                                      # 11 (Fused P3)

  # Continue fused trunk
  - [-1, 1, Conv, [384, 3, 2]]                                      # 12-P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 13 (P4)
  - [-1, 1, Conv, [384, 3, 2]]                                      # 14-P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]            # 15 (P5)

head:
  - [15, 1, Conv, [256, 1, 1, None, 1, 1, False]]                   # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]             # 17
  - [-1, 1, Conv, [256, 1, 1]]                                      # 18, Y5

  # MAFPN stage-1 (P5)
  - [13, 1, Conv, [256, 3, 2]]                                      # 19 P4->P5
  - [[-1, 18], 1, Concat, [1]]                                      # 20
  - [-1, 3, RepC3, [256, 0.5]]                                      # 21 P5a

  # MAFPN stage-2 (P4)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 22
  - [11, 1, Conv, [256, 3, 2]]                                      # 23 P3->P4
  - [[-1, -2, 13], 1, Concat, [1]]                                  # 24
  - [-1, 3, RepC3, [256, 0.5]]                                      # 25 P4a

  # MAFPN stage-3 (P3)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]                      # 26
  - [1, 1, Conv, [128, 3, 2]]                                       # 27 P2->P3
  - [[-1, -2, 11], 1, Concat, [1]]                                  # 28
  - [-1, 3, RepC3, [128, 0.5]]                                      # 29 P3a

  # Cross-scale refinement
  - [[26, -1], 1, Concat, [1]]                                      # 30
  - [-1, 3, RepC3, [128, 0.5]]                                      # 31 P3b

  - [29, 1, Conv, [256, 3, 2]]                                      # 32 P3a->P4
  - [31, 1, Conv, [256, 3, 2]]                                      # 33 P3b->P4
  - [[-1, -2, 25, 22], 1, Concat, [1]]                              # 34
  - [-1, 3, RepC3, [256, 0.5]]                                      # 35 P4b

  - [25, 1, Conv, [256, 3, 2]]                                      # 36 P4a->P5
  - [35, 1, Conv, [256, 3, 2]]                                      # 37 P4b->P5
  - [[-1, -2, 21], 1, Concat, [1]]                                  # 38
  - [-1, 3, RepC3, [256, 0.5]]                                      # 39 P5b

  - [[31, 35, 39], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]      # Detect(P3, P4, P5)
