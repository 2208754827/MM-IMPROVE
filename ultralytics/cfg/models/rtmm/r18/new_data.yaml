# ============================================================
# RT-DETR-r18 MM mid
# + CSP_MutilScaleEdgeInformationEnhance
# + CMXFusion
# + DAttention
# + ASF-P2-lite
# + ScalSeq / SSF
#
# Backbone:
#   RGB + IR dual branches
#   P2 CMXFusion
#   P3 CMXFusion
#   P4/P5 single-stream
#
# Head:
#   DAttention
#   ASF / Zoom_cat
#   RepC3
#   ScalSeq
#   P2-lite
#   RT-DETR Decoder
# ============================================================

nc: 80

scales:
  l: [1.00, 1.00, 1024]


# ============================================================
# Backbone
# ============================================================
backbone:

  # ----------------------------------------------------------
  # RGB branch
  # ----------------------------------------------------------
  - [-1, 1, Conv, [64, 3, 2], 'RGB']                       # 0  RGB P1/2
  - [-1, 1, Conv, [128, 3, 2]]                             # 1  RGB P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]    # 2  RGB P2


  # ----------------------------------------------------------
  # IR branch
  # ----------------------------------------------------------
  - [-1, 1, Conv, [64, 3, 2], 'X']                         # 3  IR P1/2
  - [-1, 1, Conv, [128, 3, 2]]                             # 4  IR P2/4
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [128]]   # 5  IR P2


  # ----------------------------------------------------------
  # P2 cross-modal fusion
  # ----------------------------------------------------------
  - [[2, 5], 1, CMXFusion, []]                             # 6  Fused P2


  # ----------------------------------------------------------
  # RGB -> P3
  # ----------------------------------------------------------
  - [2, 1, Conv, [256, 3, 2]]                              # 7  RGB P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]    # 8  RGB P3


  # ----------------------------------------------------------
  # IR -> P3
  # ----------------------------------------------------------
  - [5, 1, Conv, [256, 3, 2]]                              # 9  IR P3/8
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [256]]    # 10 IR P3


  # ----------------------------------------------------------
  # P3 cross-modal fusion
  # ----------------------------------------------------------
  - [[8, 10], 1, CMXFusion, []]                            # 11 Fused P3


  # ----------------------------------------------------------
  # Single-stream trunk
  # ----------------------------------------------------------
  - [-1, 1, Conv, [384, 3, 2]]                             # 12 P4/16
  - [-1, 1, CSP_MutilScaleEdgeInformationEnhance, [384]]   # 13 P4

  - [-1, 1, Conv, [384, 3, 2]]                             # 14 P5/32
  - [-1, 3, CSP_MutilScaleEdgeInformationEnhance, [384]]   # 15 P5


# ============================================================
# Head
# ============================================================
head:

  # ----------------------------------------------------------
  # P5 semantic enhancement
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 16 input_proj.2
  - [-1, 1, TransformerEncoderLayer_DAttention, [1024]]    # 17 DAttention
  - [-1, 1, Conv, [256, 1, 1]]                             # 18 Y5


  # ----------------------------------------------------------
  # P5 -> P4
  # ----------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]             # 19 P5 -> P4


  # ----------------------------------------------------------
  # P4 ASF fusion
  # ----------------------------------------------------------
  - [11, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 20 input_proj.1
                                                              #    Fused P3

  - [[-1, 13, -2], 1, Zoom_cat, []]                        # 21 ASF / Zoom_cat
                                                              #    Fused P3 + P4 + TD P4

  - [-1, 3, RepC3, [256, 0.5]]                             # 22 Y4

  - [-1, 1, Conv, [256, 1, 1]]                             # 23

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]             # 24 P4 -> P3


  # ----------------------------------------------------------
  # P3 ASF fusion
  # ----------------------------------------------------------
  - [6, 1, Conv, [128, 1, 1, None, 1, 1, False]]          # 25 input_proj.0-lite
                                                              #    Fused P2
                                                              #    128 -> 128

  - [[-1, 11, -2], 1, Zoom_cat, []]                        # 26 ASF / Zoom_cat
                                                              #    Fused P2 + P3 + TD P3

  - [-1, 3, RepC3, [256, 0.5]]                             # 27 P3

  - [-1, 1, Conv, [256, 3, 2]]                             # 28 P3 -> P4


  # ----------------------------------------------------------
  # P4 bottom-up refinement
  # ----------------------------------------------------------
  - [[-1, 23], 1, Concat, [1]]                             # 29
  - [-1, 3, RepC3, [256, 0.5]]                             # 30 P4

  - [-1, 1, Conv, [256, 3, 2]]                             # 31 P4 -> P5


  # ----------------------------------------------------------
  # P5 bottom-up refinement
  # ----------------------------------------------------------
  - [[-1, 18], 1, Concat, [1]]                             # 32
  - [-1, 3, RepC3, [256, 0.5]]                             # 33 P5


  # ----------------------------------------------------------
  # ScalSeq / SSF
  # Multi-scale context enhancement for P3
  # ----------------------------------------------------------
  - [[11, 13, 16], 1, ScalSeq, [256]]                      # 34
                                                              # Fused P3 + P4 + P5

  - [[27, -1], 1, Add, []]                                 # 35 P3 enhanced


  # ----------------------------------------------------------
  # P3 -> P2
  # ----------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]             # 36 P3 -> P2


  # ----------------------------------------------------------
  # P2-lite
  # ----------------------------------------------------------
  - [6, 1, Conv, [128, 1, 1, None, 1, 1, False]]           # 37 P2 projection

  - [[-1, -2], 1, Concat, [1]]                             # 38

  - [-1, 3, RepC3, [128, 0.5]]                             # 39 P2-lite


  # ----------------------------------------------------------
  # ScalSeq / SSF for P2
  # ----------------------------------------------------------
  - [[6, 35, 30], 1, ScalSeq, [128]]                       # 40
                                                              # Fused P2 + P3 + P4

  - [[39, -1], 1, Add, []]                                 # 41 P2-lite enhanced


  # ----------------------------------------------------------
  # Restore decoder dimension
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 1, 1]]                             # 42 128 -> 256


  # ----------------------------------------------------------
  # RT-DETR Decoder
  # ----------------------------------------------------------
  - [[42, 35, 30, 33], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
                                                              # 43 Detect
                                                              # P2, P3, P4, P5