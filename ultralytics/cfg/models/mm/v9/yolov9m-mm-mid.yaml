# Ultralytics YOLOv9m-MM 🚀 Mid Fusion (RGB+X)
# YOLOv9m 多模态中期融合：RGB/X 双分支独立至 P5，P4/P5 层级融合
# 架构对应官方 yolov9m.yaml（GELAN + AConv 下采样，通道 32/64/128/240/360/480）
# 注意：v9m ≠ v9c（v9m 20.2M 参数/77.9 GFLOPs < v9c 25.6M/104 GFLOPs）

# Parameters
nc: 80  # number of classes

backbone:
  # ===== RGB 分支 (0-9) =====
  - [-1, 1, Conv, [32, 3, 2], 'RGB']            # 0-P1/2 RGB
  - [-1, 1, Conv, [64, 3, 2]]                   # 1-P2/4
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]    # 2
  - [-1, 1, AConv, [240]]                       # 3-P3/8 (RGB_P3)
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]   # 4
  - [-1, 1, AConv, [360]]                       # 5-P4/16
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]   # 6 (RGB_P4)
  - [-1, 1, AConv, [480]]                       # 7-P5/32
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]   # 8
  - [-1, 1, SPPELAN, [480, 240]]                # 9 (RGB_P5)

  # ===== X 分支 (10-19) =====
  - [-1, 1, Conv, [32, 3, 2], 'X']              # 10-P1/2 X
  - [-1, 1, Conv, [64, 3, 2]]                   # 11-P2/4
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 1]]    # 12
  - [-1, 1, AConv, [240]]                       # 13-P3/8 (X_P3)
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]   # 14
  - [-1, 1, AConv, [360]]                       # 15-P4/16
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]   # 16 (X_P4)
  - [-1, 1, AConv, [480]]                       # 17-P5/32
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]   # 18
  - [-1, 1, SPPELAN, [480, 240]]                # 19 (X_P5)

  # ===== 层级融合 =====
  - [[6, 16], 1, Concat, [1]]                   # 20 Fused_P4: 360+360=720
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]   # 21 (Fused_P4, 360)

  - [[9, 19], 1, Concat, [1]]                   # 22 Fused_P5: 480+480=960
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]   # 23 (Fused_P5, 480)

head:
  # 自顶向下 (FPN)
  - [23, 1, nn.Upsample, [None, 2, "nearest"]]  # 24 Fused_P5 上采样
  - [[-1, 21], 1, Concat, [1]]                  # 25: 480+360=840
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]   # 26 (360)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 27
  - [[-1, 4], 1, Concat, [1]]                   # 28: 360+240=600
  - [-1, 1, RepNCSPELAN4, [240, 240, 120, 1]]   # 29 (P3/8-small, 240)

  # 自底向上 (PAN)
  - [-1, 1, AConv, [180]]                       # 30: 240->180
  - [[-1, 26], 1, Concat, [1]]                  # 31: 180+360=540
  - [-1, 1, RepNCSPELAN4, [360, 360, 180, 1]]   # 32 (P4/16-medium, 360)

  - [-1, 1, AConv, [240]]                       # 33: 360->240
  - [[-1, 23], 1, Concat, [1]]                  # 34: 240+480=720
  - [-1, 1, RepNCSPELAN4, [480, 480, 240, 1]]   # 35 (P5/32-large, 480)

  - [[29, 32, 35], 1, Detect, [nc]]             # 36 Detect(P3, P4, P5)
